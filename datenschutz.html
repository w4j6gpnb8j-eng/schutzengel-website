  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

n<\u002Fhelmet>\n<div class=\"doc\" style=\"font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; color: #3f4a3c; background: #fcf9f8; font-size: 18px; line-height: 1.55; min-height: 100vh\">\n\n<header style=\"border-bottom: 1px solid #e5e2e1\">\n<div style=\"max-width: 720px; margin: 0 auto; padding: 0 20px; height: 64px; display: flex; align-items: center\">\n<a href=\"index.html\" aria-label=\"SchutzEngel Startseite\" style=\"display: flex; align-items: center; gap: 8px; text-decoration: none; color: #006e1c\">\n<svg aria-hidden=\"true\" width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 100 100\" style=\"display: block; flex-shrink: 0\"><circle cx=\"50\" cy=\"50\" r=\"50\" fill=\"#006e1c\"><\u002Fcircle><ellipse cx=\"50\" cy=\"19\" rx=\"17\" ry=\"7.5\" fill=\"#98f290\"><\u002Fellipse><ellipse cx=\"50\" cy=\"19\" rx=\"8\" ry=\"1.6\" fill=\"#006e1c\"><\u002Fellipse><path d=\"M7,38 C26,33 40,55 50,71 C60,55 74,33 93,38 C86,58 64,77 50,85 C36,77 14,58 7,38 Z\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"4.5\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n<span style=\"font-size: 24px; font-weight: 800; letter-spacing: -0.02em\">SchutzEngel<\u002Fspan>\n<\u002Fa>\n<\u002Fdiv>\n<\u002Fheader>\n\n<main style=\"max-width: 720px; margin: 0 auto; padding: 24px 20px 64px; display: flex; flex-direction: column; gap: 28px\">\n\n<a class=\"back\" href=\"index.html\"><span class=\"ms\" aria-hidden=\"true\">arrow_back<\u002Fspan>Zur Startseite<\u002Fa>\n\n<section style=\"display: flex; flex-direction: column; gap: 14px\">\n<span style=\"font-size: 14px; font-weight: 700; letter-spacing: 0.1em; color: #006e1c\">DATENSCHUTZ<\u002Fspan>\n<h1 style=\"margin: 0; font-size: clamp(30px, 5vw, 44px); line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; color: #1b1c1c; text-wrap: balance\">So gehen wir mit Ihren Daten um<\u002Fh1>\n<p style=\"margin: 0; font-size: 19px; text-wrap: pretty\">Hier steht, welche Daten diese Website verarbeitet, wofür und wie lange. Die Erklärung gilt für diese Website mit Startseite, Quiz, Warteliste und Beta-Anmeldung. Für die App veröffentlichen wir eine gesonderte Datenschutzerklärung.<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: #526069\">Stand: Oktober 2026<\u002Fp>\n<\u002Fsection>\n\n<section aria-labelledby=\"sum-h\" style=\"background: #eaf5ea; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; color: #003c0b\">\n<h2 id=\"sum-h\" style=\"margin: 0; font-size: 20px; line-height: 1.3; font-weight: 800\">Das Wichtigste in Kürze<\u002Fh2>\n<p class=\"chk\"><span class=\"ms\" aria-hidden=\"true\">check<\u002Fspan><span>Das Enkeltrick-Quiz läuft nur in Ihrem Browser. Ihre Antworten speichern wir nicht.<\u002Fspan><\u002Fp>\n<p class=\"chk\"><span class=\"ms\" aria-hidden=\"true\">check<\u002Fspan><span>Ihre E-Mail-Adresse nutzen wir nur für Warteliste und Beta-Infos. Abmelden geht jederzeit mit einem Klick.<\u002Fspan><\u002Fp>\n<p class=\"chk\"><span class=\"ms\" aria-hidden=\"true\">check<\u002Fspan><span>Das Meta-Pixel lädt erst, wenn Sie zustimmen.<\u002Fspan><\u002Fp>\n<p class=\"chk\"><span class=\"ms\" aria-hidden=\"true\">check<\u002Fspan><span>Wir verkaufen keine Daten.<\u002Fspan><\u002Fp>\n<\u002Fsection>\n\n<nav aria-labelledby=\"toc-h\" style=\"background: #fff; border-radius: 24px; padding: 20px 24px; box-shadow: 0 30px 50px rgba(0,0,0,.05); display: flex; flex-direction: column; gap: 6px\">\n<h2 id=\"toc-h\" style=\"margin: 0; font-size: 20px; line-height: 1.3; font-weight: 800; color: #1b1c1c\">Inhalt<\u002Fh2>\n<div class=\"toc\">\n<a href=\"#s1\"><span class=\"n\">1<\u002Fspan>Wer ist verantwortlich?<\u002Fa>\n<a href=\"#s2\"><span class=\"n\">2<\u002Fspan>Hosting und Server-Logfiles<\u002Fa>\n<a href=\"#s3\"><span class=\"n\">3<\u002Fspan>Schriftarten und Icons<\u002Fa>\n<a href=\"#s4\"><span class=\"n\">4<\u002Fspan>Das Quiz<\u002Fa>\n<a href=\"#s5\"><span class=\"n\">5<\u002Fspan>Warteliste und Beta-Anmeldung<\u002Fa>\n<a href=\"#s6\"><span class=\"n\">6<\u002Fspan>Einladungslink und freiwillige Antwort<\u002Fa>\n<a href=\"#s7\"><span class=\"n\">7<\u002Fspan>Kontakt per E-Mail<\u002Fa>\n<a href=\"#s8\"><span class=\"n\">8<\u002Fspan>Cookies und Einwilligung<\u002Fa>\n<a href=\"#s9\"><span class=\"n\">9<\u002Fspan>Meta-Pixel<\u002Fa>\n<a href=\"#s10\"><span class=\"n\">10<\u002Fspan>Weitergabe von Daten<\u002Fa>\n<a href=\"#s11\"><span class=\"n\">11<\u002Fspan>Ihre Rechte<\u002Fa>\n<a href=\"#s12\"><span class=\"n\">12<\u002Fspan>Sicherheit<\u002Fa>\n<a href=\"#s13\"><span class=\"n\">13<\u002Fspan>Änderungen<\u002Fa>\n<\u002Fdiv>\n<\u002Fnav>\n\n<div style=\"display: flex; flex-direction: column; gap: 32px\">\n\n<section id=\"s1\" class=\"sec\">\n<h2>1. Wer ist verantwortlich?<\u002Fh2>\n<p>Verantwortlich für die Datenverarbeitung auf dieser Website ist:<\u002Fp>\n<p class=\"addr\">Moritz Kurscheid<br>Venusbergweg 34<br>53115 Bonn, Deutschland<br>E-Mail: schutzengel-app@gmx.de<\u002Fp>\n<p>Einen Datenschutzbeauftragten haben wir nicht benannt, weil das derzeit gesetzlich nicht erforderlich ist. Fragen zum Datenschutz beantworten wir unter der oben genannten E-Mail-Adresse.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"s2\" class=\"sec\">\n<h2>2. Hosting und Server-Logfiles<\u002Fh2>\n<p>Diese Website wird über GitHub Pages ausgeliefert, einen Dienst der GitHub Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, USA. Beim Aufruf der Seite verarbeitet der Server technisch notwendige Daten: Ihre IP-Adresse, Datum und Uhrzeit, die aufgerufene Seite sowie Browser- und Systeminformationen. Das ist nötig, um die Seite anzuzeigen und Missbrauch abzuwehren.<\u002Fp>\n<p>Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO. Unser berechtigtes Interesse ist eine sichere und stabile Website. Soweit Daten in die USA übermittelt werden, geschieht das auf Grundlage geeigneter Garantien, etwa des EU-US Data Privacy Framework oder von Standardvertragsklauseln.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"s3\" class=\"sec\">\n<h2>3. Schriftarten und Icons<\u002Fh2>\n<p>Zur Darstellung nutzen wir die Schriften „Atkinson Hyperlegible Next“ und „Material Symbols“. Diese werden derzeit von Servern der Google Ireland Limited, Gordon House, Barrow Street, Dublin 4, Irland, geladen. Dabei erfährt Google Ihre IP-Adresse und dass Sie diese Website besuchen.<\u002Fp>\n<p>Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO. Wir möchten die Seite einheitlich und gut lesbar darstellen.<\u002Fp>\n<p><span class=\"ph\">[Hinweis: Diesen Abschnitt ersetzen durch „Die Schriften sind lokal eingebunden. Dabei werden keine Daten an Google übertragen“, sobald die Schriften auf dem eigenen Server liegen.]<\u002Fspan><\u002Fp>\n<\u002Fsection>\n\n<section id=\"s4\" class=\"sec\">\n<h2>4. Das Quiz<\u002Fh2>\n<p>Das Enkeltrick-Quiz läuft vollständig in Ihrem Browser. Ihre Antworten und Ihr Ergebnis werden weder an uns noch an Dritte übertragen.<\u002Fp>\n<p>Wenn Sie das Quiz per WhatsApp teilen, öffnet sich WhatsApp auf Ihrem Gerät mit einem vorgefertigten Text. Erst wenn Sie dort auf „Senden“ tippen, verarbeitet WhatsApp Daten nach der eigenen Datenschutzerklärung. Wir erhalten dabei keine Daten.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"s5\" class=\"sec\">\n<h2>5. Warteliste und Beta-Anmeldung<\u002Fh2>\n<p>Wenn Sie sich für die Beta eintragen, verarbeiten wir:<\u002Fp>\n<ul>\n<li>Ihre E-Mail-Adresse<\u002Fli>\n<li>den Zeitpunkt von Anmeldung und Bestätigung<\u002Fli>\n<li>Ihre IP-Adresse bei Anmeldung und Bestätigung, als Nachweis Ihrer Einwilligung<\u002Fli>\n<li>Ihren Einladungscode, falls Sie über einen Einladungslink gekommen sind<\u002Fli>\n<\u002Ful>\n<p><strong>Wofür:<\u002Fstrong> Wir reservieren Ihren Platz, schicken Ihnen ausschließlich Informationen zur Beta und zum Start von SchutzEngel und dokumentieren Ihre Einwilligung.<\u002Fp>\n<p><strong>Double-Opt-in:<\u002Fstrong> Wir senden Ihnen zuerst eine Bestätigungs-E-Mail. Erst wenn Sie den Link darin anklicken, ist Ihre Anmeldung gültig. Nicht bestätigte Anmeldungen löschen wir nach <span class=\"ph\">[7 Tagen]<\u002Fspan>.<\u002Fp>\n<p><strong>Rechtsgrundlage:<\u002Fstrong> Ihre Einwilligung (Art. 6 Abs. 1 lit. a DSGVO). Den Nachweis der Einwilligung speichern wir auf Grundlage von Art. 6 Abs. 1 lit. f DSGVO.<\u002Fp>\n<p><strong>Dienstleister:<\u002Fstrong> Wir versenden E-Mails über <span class=\"ph\">[Name des E-Mail-Dienstes, Sitz und Serverstandort]<\u002Fspan>. Mit dem Anbieter besteht ein Auftragsverarbeitungsvertrag nach Art. 28 DSGVO.<\u002Fp>\n<p><strong>Speicherdauer:<\u002Fstrong> Bis Sie sich abmelden, mit einem Klick auf den Abmeldelink in jeder E-Mail oder per Nachricht an uns. Danach löschen wir Ihre E-Mail-Adresse. Nur den Nachweis über Anmeldung und Abmeldung bewahren wir bis zum Ablauf der gesetzlichen Verjährungsfrist von drei Jahren (gerechnet ab Ende des Jahres der Abmeldung) auf, um uns gegen Ansprüche verteidigen zu können.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"s6\" class=\"sec\">\n<h2>6. Einladungslink und freiwillige Antwort<\u002Fh2>\n<p>Nach der Anmeldung erhalten Sie einen persönlichen Einladungslink. Wir speichern, welcher Code zu Ihrer Anmeldung gehört und wie viele Anmeldungen darüber zustande kamen, damit wir Ihren Platz in der Warteliste verbessern können. Die E-Mail-Adressen der Eingeladenen sehen Sie nicht. Wenn Sie den Link per WhatsApp teilen, gilt, was in Abschnitt 4 steht.<\u002Fp>\n<p>Auf der Dankeseite können Sie freiwillig schreiben, wie alt Ihre Eltern sind und was Sie beunruhigt. Wir werten diese Angaben nur zusammengefasst und ohne Bezug zu Ihrer E-Mail-Adresse aus <span class=\"ph\">[an die technische Umsetzung anpassen]<\u002Fspan>. Bitte schreiben Sie keine Namen und keine Gesundheitsdaten hinein.<\u002Fp>\n<p>Rechtsgrundlage ist Ihre Einwilligung (Art. 6 Abs. 1 lit. a DSGVO), die Sie jederzeit widerrufen können.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"s7\" class=\"sec\">\n<h2>7. Kontakt per E-Mail<\u002Fh2>\n<p>Wenn Sie uns schreiben, verarbeiten wir Ihre Nachricht und Ihre Absenderdaten, um sie zu beantworten. Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO, bei Vertragsbezug Art. 6 Abs. 1 lit. b DSGVO. Wir löschen die Nachricht, sobald Ihre Anfrage erledigt ist und keine Aufbewahrungspflichten entgegenstehen.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"s8\" class=\"sec\">\n<h2>8. Cookies und Einwilligung<\u002Fh2>\n<p>Beim ersten Besuch fragen wir Sie, ob Sie nur notwendige Cookies zulassen oder alle akzeptieren. Notwendige Technologien, zum Beispiel die Speicherung Ihrer Cookie-Entscheidung, setzen wir ohne Einwilligung ein, weil sie für den Betrieb der Seite erforderlich sind (§ 25 Abs. 2 Nr. 2 TDDDG).<\u002Fp>\n<p>Alle anderen setzen wir nur mit Ihrer Einwilligung ein (§ 25 Abs. 1 TDDDG, Art. 6 Abs. 1 lit. a DSGVO). Ihre Einwilligung können Sie jederzeit mit Wirkung für die Zukunft widerrufen: über den Link „Cookie-Einstellungen“ im Footer der Website oder per E-Mail an uns.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"s9\" class=\"sec\">\n<h2>9. Meta-Pixel<\u002Fh2>\n<p>Wenn Sie „Alle akzeptieren“ wählen, laden wir das Meta-Pixel der Meta Platforms Ireland Limited, Merrion Road, Dublin 4, D04 X2K5, Irland („Meta“). Es hilft uns zu messen, welche unserer Anzeigen auf Facebook und Instagram zu Anmeldungen führen.<\u002Fp>\n<p>Dabei kann Meta zum Beispiel Ihre IP-Adresse, Browser- und Geräteinformationen, die aufgerufene Seite und Ihre Aktionen auf der Seite erhalten, etwa die Anmeldung zur Beta. Sind Sie bei Facebook oder Instagram angemeldet, kann Meta diese Daten Ihrem Konto zuordnen.<\u002Fp>\n<p>Für das Erfassen und Weiterleiten dieser Daten an Meta sind wir gemeinsam mit Meta verantwortlich (Art. 26 DSGVO). Für die weitere Verarbeitung ist Meta allein verantwortlich. Wie Meta Daten verarbeitet, steht in der Datenschutzrichtlinie von Meta.<\u002Fp>\n<p>Rechtsgrundlage ist Ihre Einwilligung (Art. 6 Abs. 1 lit. a DSGVO, § 25 Abs. 1 TDDDG). Ohne Ihre Zustimmung wird das Pixel nicht geladen. Daten können in die USA übermittelt werden. Meta stützt das auf geeignete Garantien wie das EU-US Data Privacy Framework.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"s10\" class=\"sec\">\n<h2>10. Weitergabe von Daten<\u002Fh2>\n<p>Wir verkaufen Ihre Daten nicht. Wir geben sie nur an die in dieser Erklärung genannten Dienstleister weiter, und nur, soweit das nötig ist. Eine automatisierte Entscheidungsfindung durch uns findet nicht statt.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"s11\" class=\"sec\">\n<h2>11. Ihre Rechte<\u002Fh2>\n<p>Sie haben nach der DSGVO folgende Rechte:<\u002Fp>\n<ul>\n<li><strong>Auskunft<\u002Fstrong> über Ihre gespeicherten Daten (Art. 15)<\u002Fli>\n<li><strong>Berichtigung<\u002Fstrong> falscher Daten (Art. 16)<\u002Fli>\n<li><strong>Löschung<\u002Fstrong> Ihrer Daten (Art. 17)<\u002Fli>\n<li><strong>Einschränkung<\u002Fstrong> der Verarbeitung (Art. 18)<\u002Fli>\n<li><strong>Datenübertragbarkeit<\u002Fstrong> (Art. 20)<\u002Fli>\n<li><strong>Widerspruch<\u002Fstrong> gegen Verarbeitungen auf Grundlage berechtigter Interessen, aus Gründen, die sich aus Ihrer besonderen Situation ergeben (Art. 21)<\u002Fli>\n<li><strong>Widerruf<\u002Fstrong> einer Einwilligung mit Wirkung für die Zukunft (Art. 7 Abs. 3)<\u002Fli>\n<\u002Ful>\n<p>Schreiben Sie uns dafür einfach an die E-Mail-Adresse aus Abschnitt 1.<\u002Fp>\n<p>Außerdem können Sie sich bei einer Datenschutzaufsichtsbehörde beschweren, zum Beispiel bei der Landesbeauftragten für Datenschutz und Informationsfreiheit Nordrhein-Westfalen, Kavalleriestraße 2–4, 40213 Düsseldorf.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"s12\" class=\"sec\">\n<h2>12. Sicherheit<\u002Fh2>\n<p>Die Verbindung zwischen Ihrem Browser und dieser Website ist per HTTPS verschlüsselt.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"s13\" class=\"sec\">\n<h2>13. Änderungen<\u002Fh2>\n<p>Wir passen diese Erklärung an, wenn sich die Website oder die Rechtslage ändert. Es gilt die jeweils hier veröffentlichte Fassung.<\u002Fp>\n<\u002Fsection>\n\n<\u002Fdiv>\n\n<\u002Fmain>\n\n<footer style=\"padding: 24px 20px 40px; border-top: 1px solid #e5e2e1\">\n<nav aria-label=\"Rechtliches\" style=\"max-width: 720px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 16px; font-weight: 700\">\n<a href=\"impressum.html\" style=\"color: #006e1c; min-height: 44px; display: inline-flex; align-items: center\">Impressum<\u002Fa>\n<a href=\"datenschutz.html\" aria-current=\"page\" style=\"color: #006e1c; min-height: 44px; display: inline-flex; align-items: center\">Datenschutz<\u002Fa>\n<a href=\"agb.html\" style=\"color: #006e1c; min-height: 44px; display: inline-flex; align-items: center\">AGB<\u002Fa>\n<a href=\"kontakt.html\" style=\"color: #006e1c; min-height: 44px; display: inline-flex; align-items: center\">Kontakt<\u002Fa>\n<\u002Fnav>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:7400}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {};\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
