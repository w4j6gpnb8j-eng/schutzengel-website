<body>
  <div id="__bundler_placeholder">Loading SchutzEngel – Early Access...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

lor:#ba1a1a}\n.opt{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;padding:0 16px;border:2px solid #becab9;border-radius:12px;background:#fff;color:#1b1c1c;font:700 20px/1.2 'Atkinson Hyperlegible Next',system-ui,sans-serif;cursor:pointer;transition:border-color .2s,background .2s,transform .1s}\n.opt:hover:not(:disabled){border-color:#6f7a6b}\n.opt:active:not(:disabled){transform:scale(.97)}\n.opt:disabled{cursor:default}\n.opt[data-state=\"right\"]{border-color:#006e1c;background:#eaf5ea;color:#003c0b}\n.opt[data-state=\"wrong\"]{border-color:#526069;background:#eef3f7}\n.opt[data-state=\"dim\"]{opacity:.55}\n.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border:2px solid #becab9;border-radius:999px;background:#fff;color:#1b1c1c;font:700 16px/1.2 'Atkinson Hyperlegible Next',system-ui,sans-serif;white-space:nowrap;cursor:pointer;transition:background .2s,border-color .2s,color .2s}\n.chip:hover{border-color:#6f7a6b}\n.chip[aria-expanded=\"true\"]{background:#006e1c;border-color:#006e1c;color:#fff}\n.tab{min-height:52px;padding:0 14px;border:0;border-bottom:3px solid transparent;background:none;color:#526069;font:700 17px/1.2 'Atkinson Hyperlegible Next',system-ui,sans-serif;white-space:nowrap;cursor:pointer;border-radius:8px 8px 0 0}\n.tab:hover{color:#1b1c1c}\n.tab[aria-selected=\"true\"]{color:#006e1c;border-bottom-color:#006e1c}\n.scrollrow{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}\n.scrollrow::-webkit-scrollbar{display:none}\n.lnk{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 4px;background:none;border:0;color:#006e1c;font:700 18px/1.3 'Atkinson Hyperlegible Next',system-ui,sans-serif;text-decoration:underline;text-underline-offset:4px;cursor:pointer;border-radius:8px}\n.fade{animation:seFade .5s cubic-bezier(.4,0,.6,1) both}\n.fade2{animation:seFade .7s cubic-bezier(.4,0,.6,1) .15s both}\n.fade3{animation:seFade .7s cubic-bezier(.4,0,.6,1) .3s both}\n@keyframes seFade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}\n.nudge{animation:seNudge 2.4s cubic-bezier(.4,0,.6,1) infinite}\n@keyframes seNudge{0%,60%,100%{transform:none}30%{transform:translateY(4px)}}\n.bar{transition:width .6s cubic-bezier(.4,0,.6,1)}\n.top-cta{display:none}\n.sticky{position:sticky;bottom:0;z-index:20}\n.hero-grid{display:grid;gap:36px}\n.phones{zoom:.6}\n@media (min-width:600px){.phones{zoom:.8}}\n@media (min-width:860px){.top-cta{display:inline-flex}.sticky{display:none}}\n@media (min-width:980px){.hero-grid{grid-template-columns:1.1fr .9fr;align-items:center;gap:56px}.phones{zoom:.95}}\nsummary{list-style:none;cursor:pointer}\nsummary::-webkit-details-marker{display:none}\ndetails[open] .chev{transform:rotate(180deg)}\n.chev{transition:transform .2s cubic-bezier(.4,0,.6,1)}\n@media (prefers-reduced-motion:reduce){.se *{animation:none!important;transition:none!important}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div class=\"se\" style=\"font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; color: #3f4a3c; background: #fcf9f8; font-size: 18px; line-height: 1.55; min-height: 100vh\">\n\n<sc-if value=\"{{done}}\" hint-placeholder-val=\"{{ false }}\">\n<dc-import name=\"Danke\" hint-size=\"100%,1800px\"><\u002Fdc-import>\n<\u002Fsc-if>\n\n<sc-if value=\"{{notDone}}\" hint-placeholder-val=\"{{ true }}\">\n\n<\u0021-- 0. TOP-BAR -->\n<header style=\"background: #fcf9f8\">\n<div style=\"max-width: 1120px; margin: 0 auto; padding: 0 20px; height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px\">\n<a href=\"#top\" aria-label=\"SchutzEngel Startseite\" style=\"display: flex; align-items: center; gap: 8px; text-decoration: none; color: #006e1c\">\n<svg aria-hidden=\"true\" width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 100 100\" style=\"display: block; flex-shrink: 0\"><circle cx=\"50\" cy=\"50\" r=\"50\" fill=\"#006e1c\"><\u002Fcircle><ellipse cx=\"50\" cy=\"19\" rx=\"17\" ry=\"7.5\" fill=\"#98f290\"><\u002Fellipse><ellipse cx=\"50\" cy=\"19\" rx=\"8\" ry=\"1.6\" fill=\"#006e1c\"><\u002Fellipse><path d=\"M7,38 C26,33 40,55 50,71 C60,55 74,33 93,38 C86,58 64,77 50,85 C36,77 14,58 7,38 Z\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"4.5\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n<span style=\"font-size: 24px; font-weight: 800; letter-spacing: -0.02em\">SchutzEngel<\u002Fspan>\n<\u002Fa>\n<a class=\"btn top-cta\" href=\"#platz\" style=\"min-height: 48px; font-size: 17px; padding: 0 20px\">Platz sichern<\u002Fa>\n<\u002Fdiv>\n<\u002Fheader>\n\n<\u0021-- SCHNELL GEFRAGT (ganz oben) -->\n<nav aria-label=\"Schnell gefragt\" style=\"border-top: 1px solid #e5e2e1; border-bottom: 1px solid #e5e2e1; background: #fff\">\n<div style=\"max-width: 1120px; margin: 0 auto\">\n<div class=\"scrollrow\" style=\"display: flex; align-items: center; gap: 8px; padding: 10px 20px\">\n<span style=\"font-size: 14px; font-weight: 700; letter-spacing: 0.1em; color: #526069; white-space: nowrap; padding-right: 4px\">SCHNELL GEFRAGT<\u002Fspan>\n<sc-for list=\"{{qas}}\" as=\"item\" hint-placeholder-count=\"5\">\n<button class=\"chip\" type=\"button\" aria-expanded=\"{{item.expanded}}\" aria-controls=\"qa-panel\" sc-camel-on-click=\"{{item.toggle}}\">{{item.q}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div id=\"qa-panel\" aria-live=\"polite\">\n<sc-if value=\"{{qaOpen}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"fade\" style=\"margin: 0 20px 14px; padding: 16px 18px; border-radius: 12px; background: #eaf5ea; color: #003c0b; display: flex; gap: 12px; align-items: flex-start\">\n<span class=\"ms\" aria-hidden=\"true\" style=\"font-size: 24px; margin-top: 2px\">chat_bubble<\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 4px; flex: 1\">\n<p style=\"margin: 0; font-size: 17px; font-weight: 800\">{{qaQ}}<\u002Fp>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.5\">{{qaA}}<\u002Fp>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{qaClose}}\" aria-label=\"Antwort schließen\" style=\"width: 44px; height: 44px; margin: -10px -10px 0 0; border: 0; background: none; color: #003c0b; cursor: pointer; border-radius: 8px; display: flex; align-items: center; justify-content: center\"><span class=\"ms\" aria-hidden=\"true\">close<\u002Fspan><\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fnav>\n\n<main id=\"top\">\n\n<\u0021-- 1. HERO -->\n<section ref=\"{{heroRef}}\" style=\"padding: 32px 20px 48px\">\n<div class=\"hero-grid\" style=\"max-width: 1120px; margin: 0 auto\">\n<div style=\"display: flex; flex-direction: column; gap: 18px\">\n\n<div class=\"fade\" style=\"align-self: flex-start; display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 10px; border-radius: 12px; background: #d3e2ed; color: #1b1c1c\">\n<span style=\"width: 40px; height: 40px; border-radius: 999px; background: #fff; color: #26333b; display: flex; align-items: center; justify-content: center\"><span class=\"ms\" aria-hidden=\"true\" style=\"font-size: 24px\">family_restroom<\u002Fspan><\u002Fspan>\n<span style=\"font-size: 20px; line-height: 1.2; font-weight: 800\">Für Kinder &amp; Enkel<\u002Fspan>\n<\u002Fdiv>\n\n<h1 class=\"fade2\" style=\"margin: 0; font-size: clamp(32px, 5.4vw, 54px); line-height: 1.12; font-weight: 800; letter-spacing: -0.02em; color: #1b1c1c; text-wrap: balance\">Sie sorgen sich, dass Ihre Eltern auf Telefon­betrüger hereinfallen?<\u002Fh1>\n\n<p class=\"fade3\" style=\"margin: 0; font-size: 20px; line-height: 1.5; color: #1b1c1c; max-width: 32em; text-wrap: pretty\"><strong style=\"color: #006e1c\">SchutzEngel<\u002Fstrong> ist eine App für iPhone und Android: Ihre Eltern trainieren mit einem Quiz, <strong>5 Minuten täglich<\u002Fstrong>, Betrugsmaschen zu erkennen. <strong>Sie sehen<\u002Fstrong>, wie weit sie sind.<\u002Fp>\n<p style=\"margin: -6px 0 0; font-size: 16px; font-weight: 700; color: #526069\">Kein Seminar. Keine ss nie etwas passiert. Ich verspreche Ihnen, dass Ihre Eltern mehr wissen als vorher, und dass ich ehrlich zu Ihnen bin.<\u002Fp>\n<p style=\"margin: 0; font-size: 16px; font-weight: 800; color: #006e1c\">Moritz, Gründer<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{tabPrice}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"fade\" style=\"display: flex; flex-direction: column; gap: 12px; color: #1b1c1c\">\n<p style=\"margin: 0; display: flex; gap: 10px\"><span class=\"ms\" aria-hidden=\"true\" style=\"font-size: 24px; color: #006e1c\">check_circle<\u002Fspan><span><strong>Beta kostenlos testen<\u002Fstrong>, nur 500 Plätze<\u002Fspan><\u002Fp>\n<p style=\"margin: 0; display: flex; gap: 10px\"><span class=\"ms\" aria-hidden=\"true\" style=\"font-size: 24px; color: #006e1c\">check_circle<\u002Fspan><span>Danach <strong>8,99 €/Monat<\u002Fstrong> oder <strong>79,99 €/Jahr<\u002Fstrong><\u002Fspan><\u002Fp>\n<p style=\"margin: 0; display: flex; gap: 10px\"><span class=\"ms\" aria-hidden=\"true\" style=\"font-size: 24px; color: #006e1c\">check_circle<\u002Fspan><span>Ihr Gründerpreis bleibt dauerhaft fix<\u002Fspan><\u002Fp>\n<p style=\"margin: 0; display: flex; gap: 10px\"><span class=\"ms\" aria-hidden=\"true\" style=\"font-size: 24px; color: #006e1c\">check_circle<\u002Fspan><span>Jederzeit kündbar<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{tabTester}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"fade\" style=\"display: flex; flex-direction: column; gap: 16px\">\n<div style=\"position: relative; overflow: hidden; border-radius: 20px; background: #006e1c; color: #fff; padding: 26px 22px 22px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 30px 50px rgba(0,110,28,.2)\">\n<span class=\"ms fill\" aria-hidden=\"true\" style=\"position: absolute; right: -14px; top: -18px; font-size: 140px; color: rgba(255,255,255,.08)\">format_quote<\u002Fspan>\n<div style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 44px; height: 44px; border-radius: 999px; background: #98f290; color: #003c0b; display: flex; align-items: center; justify-content: center\"><span class=\"ms fill\" aria-hidden=\"true\" style=\"font-size: 26px\">verified_user<\u002Fspan><\u002Fspan><span style=\"font-size: 15px; font-weight: 700; color: #d6f5d2\">Nach dem Enkeltrick-Quiz<\u002Fspan><\u002Fdiv>\n<p style=\"margin: 0; font-size: clamp(22px, 3.4vw, 28px); line-height: 1.3; font-weight: 800; letter-spacing: -0.01em; text-wrap: pretty\">Ein Tester sagte nach dem Quiz, er fühle sich deutlich sicherer.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<\u0021-- 5. FINALER CTA -->\n<section id=\"platz\" aria-labelledby=\"final-h\" style=\"padding: 56px 20px 64px; background: #eaf5ea\">\n<div style=\"max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px\">\n<svg aria-hidden=\"true\" width=\"56\" height=\"56\" sc-camel-view-box=\"0 0 100 100\" style=\"display: block; flex-shrink: 0\"><circle cx=\"50\" cy=\"50\" r=\"50\" fill=\"#006e1c\"><\u002Fcircle><ellipse cx=\"50\" cy=\"19\" rx=\"17\" ry=\"7.5\" fill=\"#98f290\"><\u002Fellipse><ellipse cx=\"50\" cy=\"19\" rx=\"8\" ry=\"1.6\" fill=\"#006e1c\"><\u002Fellipse><path d=\"M7,38 C26,33 40,55 50,71 C60,55 74,33 93,38 C86,58 64,77 50,85 C36,77 14,58 7,38 Z\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"4.5\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n<h2 id=\"final-h\" style=\"margin: 0; font-size: clamp(28px, 4.4vw, 40px); line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; color: #1b1c1c; text-wrap: balance\">Vorsicht ist besser als Nachsicht. Sichern Sie sich Ihren Platz.<\u002Fh2>\n<div style=\"background: #fff; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 20px 40px rgba(0,110,28,.1)\">\n<p style=\"margin: 0; font-size: 18px; font-weight: 800; color: #1b1c1c\">Auf 500 Beta-Plätze limitiert<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; color: #003c0b\">Beta kostenlos · Gründerpreis bleibt fix<\u002Fp>\n<\u002Fdiv>\n<form sc-camel-on-submit=\"{{submitFinal}}\" novalidate=\"novalidate\" style=\"display: flex; flex-direction: column; gap: 10px\">\n<label for=\"email-final\" style=\"font-size: 16px; font-weight: 700; color: #1b1c1c\">Ihre E-Mail-Adresse<\u002Flabel>\n<input id=\"email-final\" class=\"field\" type=\"email\" inputmode=\"email\" autocomplete=\"email\" placeholder=\"name@beispiel.de\" value=\"{{emailFinal}}\" sc-camel-on-change=\"{{changeFinal}}\" aria-invalid=\"{{errFinalAria}}\" aria-describedby=\"hint-final\">\n<sc-if value=\"{{errFinal}}\" hint-placeholder-val=\"{{ false }}\"><p role=\"alert\" style=\"margin: 0; color: #ba1a1a; font-size: 16px; font-weight: 700\">Bitte geben Sie eine gültige E-Mail-Adresse ein.<\u002Fp><\u002Fsc-if>\n<button class=\"btn\" type=\"submit\" style=\"width: 100%\">Platz für meine Eltern sichern<span class=\"ms\" aria-hidden=\"true\">arrow_forward<\u002Fspan><\u002Fbutton>\n<p id=\"hint-final\" style=\"margin: 0; font-size: 15px; color: #3f4a3c\">Kostenlos · Kein Spam · Bestätigung per E-Mail (Double-Opt-in)<\u002Fp>\n<p style=\"margin: 0; padding: 10px 12px; border-radius: 10px; background: #fff; font-size: 14px; line-height: 1.45; color: #3f4a3c\">Mit dem Klick willigen Sie ein, dass wir Ihnen E-Mails zur Beta und zum Start von SchutzEngel schicken. Abmelden geht jederzeit. <a href=\"datenschutz.html\" style=\"font-weight: 700\">Datenschutzerklärung<\u002Fa><\u002Fp>\n<\u002Fform>\n<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n\n<\u0021-- FOOTER -->\n<footer style=\"padding: 24px 20px 36px; border-top: 1px solid #e5e2e1\">\n<div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 24px\">\n<span style=\"font-size: 15px; color: #526069\">© 2026 SchutzEngel<\u002Fspan>\n<nav aria-label=\"Rechtliches\" style=\"display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 16px; font-weight: 700\">\n<a href=\"impressum.html\" style=\"min-height: 44px; display: inline-flex; align-items: center\">Impressum<\u002Fa>\n<a href=\"datenschutz.html\" style=\"min-height: 44px; display: inline-flex; align-items: center\">Datenschutz<\u002Fa>\n<a href=\"agb.html\" style=\"min-height: 44px; display: inline-flex; align-items: center\">AGB<\u002Fa>\n<a href=\"kontakt.html\" style=\"min-height: 44px; display: inline-flex; align-items: center\">Kontakt<\u002Fa>\n<button type=\"button\" sc-camel-on-click=\"{{cookieReopen}}\" style=\"min-height: 44px; display: inline-flex; align-items: center; padding: 0; border: 0; background: none; color: #006e1c; font: inherit; text-decoration: underline; cursor: pointer\">Cookie-Einstellungen<\u002Fbutton>\n<\u002Fnav>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u0021-- Sticky-CTA (nur mobil, nach dem Hero) -->\n<sc-if value=\"{{showSticky}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"sticky fade\" style=\"padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(252,249,248,.97); border-top: 1px solid #e5e2e1; box-shadow: 0 -20px 40px rgba(0,0,0,.06)\">\n<a class=\"btn\" href=\"#platz\" style=\"width: 100%\">Platz für meine Eltern sichern<\u002Fa>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u0021-- Cookie-Banner -->\n<sc-if value=\"{{cookieOpen}}\" hint-placeholder-val=\"{{ true }}\">\n<div role=\"dialog\" aria-labelledby=\"ck-h\" aria-describedby=\"ck-t\" style=\"position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 40; max-width: 560px; margin: 0 auto; background: #fff; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.18); padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n<h2 id=\"ck-h\" style=\"margin: 0; font-size: 19px; font-weight: 800; color: #1b1c1c\">Ihre Wahl bei Cookies<\u002Fh2>\n<p id=\"ck-t\" style=\"margin: 0; font-size: 16px; line-height: 1.5\">Notwendige Cookies halten die Seite am Laufen. Mit Ihrer Zustimmung messen wir zusätzlich über das Meta-Pixel, welche Anzeigen hilfreich sind. Das Pixel lädt erst nach Ihrer Zustimmung. <a href=\"datenschutz.html\">Mehr erfahren<\u002Fa><\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px\">\n<button class=\"btn\" type=\"button\" sc-camel-on-click=\"{{cookieNecessary}}\" style=\"padding: 0 12px; font-size: 16px\">Nur notwendige<\u002Fbutton>\n<button class=\"btn\" type=\"button\" sc-camel-on-click=\"{{cookieAll}}\" style=\"padding: 0 12px; font-size: 16px\">Alle akzeptieren<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showCookieBanner&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:5200}}\">\nvar QUESTIONS = [\n  {\n    q: 'Ein Anrufer sagt: „Rate mal, wer hier ist!“ Was ist die cleverste Reaktion?',\n    a: ['Vorsichtig einen Namen raten, um höflich zu sein', 'Den Namen NICHT nennen und stattdessen sagen: „Sag du mir, wer du bist“', 'Sofort auflegen, ohne etwas zu sagen', 'Fragen, ob es um Geld geht'],\n    correct: 1,\n    hint: 'Wer rät, gibt dem Betrüger etwas in die Hand.',\n    right: 'Genau so!', wrong: 'Fast, aber Falle!',\n    explain: 'Wer einen Namen rät, liefert den Betrügern die Identität auf dem Silbertablett. Ab da spielen sie den Enkel, die Nichte oder den Neffen. Auflegen ist auch okay, aber die stärkste Reaktion ist, den Spieß umzudrehen.'\n  },\n  {\n    q: 'Der „Enkel“ sagt, seine Handynummer sei neu, weil das alte Handy kaputt ist. Was ist der sicherste nächste Schritt?',\n    a: ['Die neue Nummer speichern und zurückrufen', 'Ihn nach einem Foto der neuen Nummer fragen', 'Auflegen und die ALTE, bekannte Nummer oder einen anderen Verwandten anrufen', 'Ihn nach dem Geburtsdatum fragen'],\n    correct: 2,\n    hint: 'Vertraue nur Nummern, die du schon vorher hattest.',\n    right: 'Sauber erkannt!', wrong: 'Genau das wollen sie.',\n    explain: 'Die „neue Nummer“-Story ist ein Klassiker. Nur der Rückruf auf eine Nummer, die DU schon kennst, oder ein Anruf bei anderen Verwandten entlarvt den Betrug. Geburtsdaten findet man oft online.'\n  },\n  {\n    q: 'Der Anrufer braucht dringend 20.000 € für ein Auto, das er morgen nicht mehr kriegt. Er sagt: „Bitte erzähl niemandem was, es ist peinlich.“ Was ist hier das größte Alarmsignal?',\n    a: ['Die Höhe des Betrags', 'Dass es um ein Auto geht', 'Die Kombination aus Zeitdruck und Geheimhaltung', 'Dass der Anrufer „peinlich“ sagt'],\n    correct: 2,\n    hint: 'Was verhindert, dass du nachdenkst oder jemanden fragst?',\n    right: 'Volltreffer!', wrong: 'Nicht ganz.',\n    explain: 'Zeitdruck plus Geheimhaltung ist das Herzstück der Masche. Die Opfer sollen keine Zeit zum Nachdenken haben und niemanden fragen können. Der konkrete Grund (Auto, Wohnung, Unfall) wechselt ständig.'\n  },\n  {\n    q: 'Es klingelt an der Tür: Ein Mann sagt, er sei ein Bekannter des Enkels und komme das Geld „abholen“. Die Oma hat von der Bank schon alles abgehoben. Was sollte sie tun?',\n    a: ['Geld übergeben, aber eine Quittung verlangen', 'Nichts übergeben, Tür zu und die Polizei über 110 rufen', 'Den Enkel anrufen, während der Abholer wartet', 'Das Geld im Briefkasten hinterlegen'],\n    correct: 1,\n    hint: 'Was würde ein echter Enkel nie tun?',\n    right: 'Richtig!', wrong: 'Autsch, so nicht.',\n    explain: 'Echte Enkel schicken niemals Fremde zum Geldabholen. Die Polizei bittet man genau in so einem Moment um Hilfe, denn oft lassen sich die Abholer sogar noch festnehmen. Eine Quittung bringt nichts, das Geld ist weg.'\n  },\n  {\n    q: 'Warum sind gerade Menschen mit einem eingetragenen Vornamen im Telefonbuch, wie „Gertrud“ oder „Helmut“, ein beliebtes Ziel?',\n    a: ['Weil sie angeblich mehr Geld haben', 'Weil altmodische Vornamen auf eine ältere Generation hindeuten', 'Weil sie häufiger zu Hause sind', 'Weil sie ihre Nummer öffentlich ändern'],\n    correct: 1,\n    hint: 'Denk an Vornamen, die es heute kaum noch gibt.',\n    right: 'Gut gedacht!', wrong: 'Überraschend, oder?',\n    explain: 'Betrüger suchen in Verzeichnissen gezielt nach Vornamen, die typisch für ältere Jahrgänge sind. Tipp: Beim Telefonbucheintrag nur Initiale statt Vorname verwenden oder den Eintrag ganz löschen lassen.'\n  }\n];\nvar LETTERS = ['A', 'B', 'C', 'D'];\nfunction resultFor(score) {\n  if (score === 5) return { title: 'Absolute Profi-Abwehr!', text: 'Jetzt dein Wissen weitergeben: Schick das Quiz an Mama, Papa, Oma oder Opa.' };\n  if (score >= 3) return { title: 'Stark!', text: 'Ein, zwei Fallen waren fies. Genau deshalb lohnt es sich, das Quiz auch mit deiner Familie zu machen.' };\n  return { title: 'Gut, dass du es jetzt weißt, nicht erst am Telefon.', text: 'Lies dir die Erklärungen nochmal durch und teile das Quiz mit deinen Liebsten.' };\n}\nvar QAS = [\n  { q: 'Für wen ist das?', a: 'Für Sie, wenn Ihre Mutter, Ihr Vater oder Ihre Großeltern allein telefonieren und Sie nicht immer da sein können. Sie richten die App ein, Ihre Eltern nutzen sie.' },\n  { q: 'Was macht die App?', a: 'Ihre Eltern spielen täglich ein kurzes Quiz zu echten Maschen wie Enkeltrick oder Schockanruf. Sie sehen im Dashboard, wie weit sie sind.' },\n  { q: 'Überwacht das meine Eltern?', a: 'Nein. SchutzEngel liest keine Anrufe, Nachrichten oder Konten. Sie sehen nur den Lernstand. Den Standort nur, wenn Ihre Eltern es erlauben.' },\n  { q: 'Was kostet es?', a: 'Die Beta ist kostenlos. Danach 8,99 € im Monat oder 79,99 € im Jahr, jederzeit kündbar. Beta-Teilnehmer behalten ihren Gründerpreis.' },\n  { q: 'Wann geht’s los?', a: 'Noch in diesem Jahr, für iPhone und Android. Beta-Teilnehmer erfahren es zuerst.' }\n];\nvar TABS = [\n  { key: 'faq', label: 'Fragen' },\n  { key: 'data', label: 'Datenschutz' },\n  { key: 'founder', label: 'Über uns' },\n  { key: 'price', label: 'Beta & Preis' },\n  { key: 'tester', label: 'Stimmen' }\n];\nvar EMAIL_RE = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/;\nfunction readConsent() { try { return window.localStorage.getItem('se-consent') || ''; } catch (e) { return ''; } }\nvar WA_TEXT = 'Ich hab gerade das Enkeltrick-Quiz gemacht: 5 knifflige Fragen. Bist du wirklich sicher? Probier es mal aus: https://schutzengel.info';\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = {\n      started: false, step: 0, choice: null, score: 0, hint: false,\n      email: { hero: '', quiz: '', final: '' },\n      err: { hero: false, quiz: false, final: false },\n      done: false, cookieOpen: readConsent() ? false : null, consent: readConsent(), showSticky: false,\n      qa: -1, tab: 'faq'\n    };\n    this.heroRef = (el) => {\n      if (!el || this.io || typeof IntersectionObserver === 'undefined') return;\n      this.io = new IntersectionObserver((entries) => {\n        var e = entries[0];\n        var show = !e.isIntersecting && e.boundingClientRect.top < 0;\n        if (show !== this.state.showSticky) this.setState({ showSticky: show });\n      }, { threshold: 0 });\n      this.io.observe(el);\n    };\n    this.startQuiz = () => this.setState({ started: true, step: 0, choice: null, score: 0, hint: false });\n    this.pickers = [0, 1, 2, 3].map((i) => () => {\n      if (this.state.choice !== null) return;\n      var q = QUESTIONS[this.state.step];\n      this.setState({ choice: i, score: this.state.score + (i === q.correct ? 1 : 0) });\n    });\n    this.showHint = () => this.setState({ hint: true });\n    this.next = () => this.setState({ step: this.state.step + 1, choice: null, hint: false });\n    this.restart = () => this.setState({ started: true, step: 0, choice: null, score: 0, hint: false });\n    this.change = (key) => (e) => {\n      var email = Object.assign({}, this.state.email); email[key] = e.target.value;\n      var err = Object.assign({}, this.state.err); err[key] = false;\n      this.setState({ email: email, err: err });\n    };\n    this.submit = (key) => (e) => {\n      if (e && e.preventDefault) e.preventDefault();\n      var v = (this.state.email[key] || '').trim();\n      if (!EMAIL_RE.test(v)) {\n        var err = Object.assign({}, this.state.err); err[key] = true;\n        this.setState({ err: err });\n        return;\n      }\n      // Hier später: POST an den Newsletter-Dienst (Double-Opt-in), dann Danke-Seite.\n      this.setState({ done: true });\n      try { window.scrollTo(0, 0); } catch (x) {}\n    };\n    this.qaToggle = QAS.map((_, i) => () => this.setState({ qa: this.state.qa === i ? -1 : i }));\n    this.qaClose = () => this.setState({ qa: -1 });\n    this.tabPick = TABS.map((t) => () => this.setState({ tab: t.key }));\n    // Entscheidung wird unter 'se-consent' gespeichert ('all' oder 'necessary'). Das Meta-Pixel darf nur bei 'all' geladen werden.\n    this.cookieChoose = (v) => () => {\n      try { window.localStorage.setItem('se-consent', v); } catch (x) {}\n      this.setState({ cookieOpen: false, consent: v });\n    };\n    this.cookieAllFn = this.cookieChoose('all');\n    this.cookieNecessaryFn = this.cookieChoose('necessary');\n    this.cookieReopen = () => this.setState({ cookieOpen: true });\n  }\n  componentWillUnmount() { if (this.io) this.io.disconnect(); }\n  renderVals() {\n    var s = this.state;\n    var inQuiz = s.started && s.step < QUESTIONS.length;\n    var q = QUESTIONS[Math.min(s.step, QUESTIONS.length - 1)];\n    var answered = inQuiz && s.choice !== null;\n    var right = answered && s.choice === q.correct;\n    var options = q.a.map((t, i) => ({\n      letter: LETTERS[i], text: t, pick: this.pickers[i], isRight: answered && i === q.correct,\n      state: !answered ? 'idle' : (i === q.correct ? 'right' : (i === s.choice ? 'wrong' : 'dim'))\n    }));\n    var doneCount = s.step + (answered ? 1 : 0);\n    var res = resultFor(s.score);\n    var cookieOpen = s.cookieOpen === null ? (this.props.showCookieBanner ?? true) : s.cookieOpen;\n    var openQa = s.qa >= 0 ? QAS[s.qa] : null;\n    return {\n      done: s.done, notDone: !s.done,\n      heroRef: this.heroRef,\n      qas: QAS.map((x, i) => ({ q: x.q, expanded: String(s.qa === i), toggle: this.qaToggle[i] })),\n      qaOpen: !!openQa, qaQ: openQa ? openQa.q : '', qaA: openQa ? openQa.a : '', qaClose: this.qaClose,\n      tabs: TABS.map((t, i) => ({ label: t.label, tabId: 'tab-' + t.key, selected: String(s.tab === t.key), pick: this.tabPick[i] })),\n      activeTabId: 'tab-' + s.tab,\n      tabFaq: s.tab === 'faq', tabData: s.tab === 'data', tabFounder: s.tab === 'founder', tabPrice: s.tab === 'price', tabTester: s.tab === 'tester',\n      showStart: !s.started, inQuiz: inQuiz, showResult: s.started && !inQuiz, startQuiz: this.startQuiz,\n      stepNum: Math.min(s.step + 1, QUESTIONS.length), question: q.q, options: options,\n      progress: Math.round(doneCount / QUESTIONS.length * 100) + '%', doneCount: doneCount,\n      answered: answered,\n      showHintBtn: inQuiz && !answered && !s.hint, hintVisible: inQuiz && !answered && s.hint, hint: q.hint, showHint: this.showHint,\n      fbIcon: right ? 'check_circle' : 'info', fbColor: right ? '#006e1c' : '#526069', fbBg: right ? '#eaf5ea' : '#eef3f7',\n      fbTitle: right ? q.right : q.wrong, explain: q.explain,\n      next: this.next, nextLabel: s.step < QUESTIONS.length - 1 ? 'Nächste Frage' : 'Ergebnis ansehen',\n      score: s.score, resultTitle: res.title, resultText: res.text, restart: this.restart,\n      waHref: 'https://wa.me/?text=' + encodeURIComponent(WA_TEXT),\n      emailHero: s.email.hero, emailQuiz: s.email.quiz, emailFinal: s.email.final,\n      errHero: s.err.hero, errQuiz: s.err.quiz, errFinal: s.err.final,\n      errHeroAria: String(s.err.hero), errQuizAria: String(s.err.quiz), errFinalAria: String(s.err.final),\n      changeHero: this.change('hero'), changeQuiz: this.change('quiz'), changeFinal: this.change('final'),\n      submitHero: this.submit('hero'), submitQuiz: this.submit('quiz'), submitFinal: this.submit('final'),\n      showSticky: s.showSticky && !cookieOpen,\n      cookieOpen: cookieOpen, cookieAll: this.cookieAllFn, cookieNecessary: this.cookieNecessaryFn, cookieReopen: this.cookieReopen\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
